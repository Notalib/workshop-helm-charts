apiVersion: v1
kind: Service
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "gateway.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      # TODO: hardcoded! This is the port the SERVICE exposes — and ingress.yml already
      #       routes to `service.port`. If those two disagree, routing dies. Which value
      #       belongs here?
      port: 80
      # targetPort refers to the container's *named* port ("http" in deployment.yml),
      # so it follows the container automatically. Named ports save you a 4th hardcoding.
      targetPort: http
      protocol: TCP
