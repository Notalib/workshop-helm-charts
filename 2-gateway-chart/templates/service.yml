apiVersion: v1
kind: Service
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "gateway.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      # SOLVED: was hardcoded to 80 while ingress.yml already routed to
      # .Values.service.port. Those two disagreeing means the Ingress points at a
      # port the Service doesn't expose, and routing dies silently.
      port: {{ .Values.service.port }}
      # targetPort refers to the container's *named* port ("http" in
      # deployment.yml), so it follows the container automatically. Named ports
      # save you a fourth hardcoding.
      targetPort: http
      protocol: TCP
