apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  # SOLVED: was hardcoded to 1.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "gateway.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        helm.revision: "{{ .Release.Name }}.{{ .Release.Revision }}"
      labels:
        app.kubernetes.io/name: {{ include "gateway.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: nginx
          # SOLVED: was hardcoded to nginx:alpine.
          image: {{ .Values.image.nginx }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          volumeMounts:
            - mountPath: /etc/nginx/conf.d/default.conf
              name: nginx-config
              readOnly: true
              subPath: default.conf
          # SOLVED: both probes were hardcoded to port 80, so moving service.port
          # left them pointing at a port nothing listens on — the Pod then never
          # goes Ready, the Service gets no endpoints, and the Ingress 503s.
          #
          # Two valid fixes:
          #   port: {{ .Values.service.port }}   — template the number
          #   port: http                         — reference the NAMED port above
          #
          # The named port is better: it follows the container automatically, so
          # there is one fewer place for the number to drift. Prefer names over
          # numbers wherever Kubernetes allows it.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3

        - name: backend
          # SOLVED: was hardcoded to hashicorp/http-echo:1.0.0.
          image: {{ .Values.image.echo }}
          args:
            # SOLVED: the port appeared here, on containerPort below, AND in the
            # nginx proxy_pass in configmap-nginx.yml. One value, three references
            # — miss one and nginx proxies into the void.
            - "-listen=:{{ .Values.backend.port }}"
            - "-text={{ .Values.backend.text }}"
          ports:
            - name: backend
              containerPort: {{ .Values.backend.port }}

      volumes:
        - configMap:
            defaultMode: 420
            name: {{ include "gateway.name" . }}-nginx
            optional: false
          name: nginx-config
