{{/*
⚠️  DELIBERATELY WRONG — do not copy this into a real chart.

The object name below is HARDCODED, which means two releases of this chart
collide in one namespace (TASK 6 makes you hit that on purpose). Real charts
derive names from .Release.Name via a fullname helper — see
../2-gateway-chart/templates/_helpers.tpl, and BEST-PRACTICES.md §6.

Same for the literal port 80 in the probes below: a real chart would reference
the container's NAMED port so there's one number instead of four.

Everything is spelled out the long way here so this chart stays readable with
no helpers at all. That's the only reason.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simplest-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: simplest-nginx
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        revision: {{ .Release.Revision | quote }} # Makes sure the deployment is restarted on every upgrade
      labels:
        app.kubernetes.io/name: simplest-nginx
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: nginx
          image: nginx:{{ .Values.imageTag }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 1
            periodSeconds: 1
{{ if .Values.overrideHtml }}
          volumeMounts:
            - mountPath: /usr/share/nginx/html/index.html
              name: nginx-default-html
              readOnly: true
              subPath: my.html
      volumes:
      - name: nginx-default-html
        configMap:
          name: simplest-html-configmap
          defaultMode: 420
          optional: false
{{- end -}}
