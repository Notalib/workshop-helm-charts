{{/*
Only created when the user hasn't supplied their own Secret. Every chart that
handles credentials should offer this escape hatch — it's how you stay usable
by teams that manage secrets properly (Vault, External Secrets, SOPS) without
forcing them to fork your chart.
*/}}
{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "greetings.secretName" . }}
  labels:
    {{- include "greetings.labels" . | nindent 4 }}
type: Opaque
stringData:
  # `required` makes the chart refuse to install rather than deploy a Postgres
  # with an empty password. Failing loudly at install beats debugging at 3am.
  password: {{ required "database.password is required (or set database.existingSecret)" .Values.database.password | quote }}
{{- end }}
