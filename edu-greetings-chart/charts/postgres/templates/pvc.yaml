{{- if .Values.persistence.enabled }}
{{/*
Module 4's PVC, templated. Deliberately WITHOUT
`annotations: {"helm.sh/resource-policy": keep}` — so `helm uninstall` deletes
the claim and the data with it, and the workshop cleans up after itself. A real
database wants that annotation. See BONUS 2.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "postgres.fullname" . }}-data
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
