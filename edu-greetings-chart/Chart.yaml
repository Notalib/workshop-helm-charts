apiVersion: v2
name: greetings
description: |
  The Spring Boot + Postgres "greetings" app from workshop #1, wired by hand in
  workshop #2 module 5, now packaged as a single installable chart.
type: application

# TWO versions, and they move independently:
#   version    — this chart. Bump it for ANY change to the templates or values.
#   appVersion — the application inside. Tracks the container image tag.
# Fixing a typo in NOTES.txt bumps `version` only. Shipping a new backend build
# bumps `appVersion` (and `version`, because the chart changed too).
version: 1.0.0
appVersion: "1.2"

keywords:
  - workshop
  - example
maintainers:
  - name: Daniel Freiling

# The database ships WITH this chart, as a subchart in ./charts/postgres.
#
# `condition` lets whoever installs it swap our toy Postgres out for a real
# managed database: `--set postgres.enabled=false` and point
# `database.hostOverride` at an RDS/Azure endpoint. That single line is why
# subcharts beat copy-pasting manifests.
dependencies:
  - name: postgres
    version: "1.0.0"
    repository: "file://charts/postgres"
    condition: postgres.enabled
